<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUFAI - AI Coding Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">SUFAI</div>
            <p class="subtitle">Your AI Coding Companion</p>
        </header>

        <main>
            <div class="input-section">
                <div class="api-key-container">
                    <input type="password" id="api-key" placeholder="Enter your Gemini API Key" />
                    <small>Get your free API key from <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></small>
                </div>

                <div class="prompt-container">
                    <textarea id="prompt" placeholder="Describe the code or website you want to generate..."></textarea>
                    <button id="generate-btn">
                        <span id="btn-text">Generate Code</span>
                        <div class="loader" id="loader"></div>
                    </button>
                </div>
            </div>

            <div id="result-section" class="hidden">
                <div class="result-header">
                    <h2>Generated Code</h2>
                    <button id="download-btn" disabled>Download ZIP</button>
                </div>
                <div id="code-preview" class="code-preview">
                    <p class="placeholder-text">Generated files will appear here...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by Gemini & SUFAI</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
