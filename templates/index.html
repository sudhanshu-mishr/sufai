<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUFAI - AI Coding Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">SUFAI</div>
            <p class="subtitle">Your Expert AI Coding Companion</p>
        </header>

        <main>
            <div class="input-section">
                <!-- Configuration Section -->
                <details class="api-key-container">
                    <summary>Configuration (Model & Optional API Key)</summary>
                    <div class="config-wrapper">
                        <div class="model-select-wrapper">
                            <label for="model-select">Select AI Model:</label>
                            <select id="model-select">
                                <option value="gemini">Gemini (Google)</option>
                                <option value="huggingface">Open Source GPT (Hugging Face)</option>
                            </select>
                        </div>

                        <div class="api-key-input-wrapper">
                            <label for="api-key">API Key (Optional):</label>
                            <input type="password" id="api-key" placeholder="Enter Gemini API Key (Optional)" />
                            <small id="api-key-help">Leave blank to use the server-configured key (if available). Get your free key from <a href="https://aistudio.google.com/app/apikey" target="_blank" id="api-key-link">Google AI Studio</a>.</small>
                        </div>
                    </div>
                </details>

                <div class="prompt-container">
                    <textarea id="prompt" placeholder="Describe the code or website you want to generate... (e.g., 'A Python script to scrape news headlines' or 'A React component for a login form')"></textarea>
                    <button id="generate-btn">
                        <span id="btn-text">Generate Code</span>
                        <div class="loader" id="loader"></div>
                    </button>
                </div>
            </div>

            <div id="result-section" class="hidden">
                <div class="result-header">
                    <h2>Generated Code</h2>
                    <button id="download-btn" disabled>Download ZIP</button>
                </div>
                <div id="code-preview" class="code-preview">
                    <p class="placeholder-text">Generated files will appear here...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by Gemini, Hugging Face & SUFAI</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
